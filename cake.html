<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cake Cutting - Phool</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;overflow:hidden;background:#0a0a1a;font-family:'Poppins',sans-serif;display:flex;flex-direction:column;justify-content:center;align-items:center}
canvas#bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}
.heading{font-family:'Great Vibes',cursive;font-size:3rem;background:linear-gradient(135deg,#ffd700,#ff6b6b,#ff69b4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:30px;z-index:10;position:relative;opacity:0}
.cake-wrap{position:relative;z-index:10;cursor:pointer;opacity:0;transform:scale(0.8)}
.cake-svg{width:250px;height:250px;filter:drop-shadow(0 20px 40px rgba(0,0,0,0.5))}
.click-hint{position:absolute;top:-40px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.6);font-size:0.9rem;white-space:nowrap;animation:bounce 2s ease infinite;opacity:0;transition:opacity 0.5s}
@keyframes bounce{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-8px)}}
.smoke{position:fixed;width:8px;height:8px;background:rgba(255,255,255,0.6);border-radius:50%;filter:blur(4px);pointer-events:none;z-index:5}
.next-btn{position:fixed;bottom:40px;padding:16px 50px;background:linear-gradient(135deg,#ffd700,#ff6b6b);border:none;border-radius:50px;color:#0a0a1a;font-family:'Poppins',sans-serif;font-size:1rem;font-weight:600;cursor:pointer;z-index:20;opacity:0;transform:translateY(30px);transition:all 0.4s;box-shadow:0 8px 30px rgba(255,107,107,0.3)}
.next-btn.show{opacity:1;transform:translateY(0);animation:pulse 2s ease infinite}
.next-btn:hover{transform:translateY(-3px) scale(1.05)}
@keyframes pulse{0%,100%{box-shadow:0 8px 30px rgba(255,107,107,0.3)}50%{box-shadow:0 12px 40px rgba(255,107,107,0.5)}}
.balloon{position:fixed;bottom:-100px;border-radius:50%;z-index:3;animation:rise linear forwards}
@keyframes rise{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-60vh) rotate(10deg)}100%{transform:translateY(-120vh) rotate(-5deg)}}
.confetti-piece{position:fixed;top:-20px;z-index:15;animation:confettiFall linear forwards}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="heading" id="heading">Let's Cut the Cake! 🎂</div>
<div class="cake-wrap" id="cakeWrap">
<div class="click-hint" id="clickHint">Click the cake!</div>
<svg class="cake-svg" viewBox="0 0 250 250">
<defs>
<linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#ff6b6b"/><stop offset="100%" style="stop-color:#ee5a24"/></linearGradient>
<linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#ffd700"/><stop offset="100%" style="stop-color:#ff6b6b"/></linearGradient>
<linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#ff69b4"/><stop offset="100%" style="stop-color:#ff1493"/></linearGradient>
</defs>
<!-- Bottom layer -->
<rect x="30" y="170" width="190" height="55" rx="10" fill="url(#g1)"/>
<rect x="30" y="170" width="190" height="15" rx="8" fill="rgba(255,255,255,0.2)"/>
<!-- Middle layer -->
<rect x="50" y="125" width="150" height="50" rx="10" fill="url(#g2)"/>
<rect x="50" y="125" width="150" height="12" rx="6" fill="rgba(255,255,255,0.2)"/>
<!-- Top layer -->
<rect x="70" y="85" width="110" height="45" rx="10" fill="url(#g3)"/>
<rect x="70" y="85" width="110" height="10" rx="5" fill="rgba(255,255,255,0.2)"/>
<!-- Frosting drips -->
<circle cx="55" cy="170" r="8" fill="#fff" opacity="0.7"/>
<circle cx="85" cy="170" r="8" fill="#fff" opacity="0.7"/>
<circle cx="115" cy="170" r="8" fill="#fff" opacity="0.7"/>
<circle cx="145" cy="170" r="8" fill="#fff" opacity="0.7"/>
<circle cx="175" cy="170" r="8" fill="#fff" opacity="0.7"/>
<circle cx="200" cy="170" r="8" fill="#fff" opacity="0.7"/>
<!-- Candle -->
<rect x="118" y="50" width="14" height="40" rx="4" fill="#fff"/>
<rect x="120" y="50" width="10" height="40" rx="3" fill="rgba(255,215,0,0.3)"/>
<!-- Flame -->
<g id="flame">
<ellipse cx="125" cy="42" rx="8" ry="12" fill="#ffd700"/>
<ellipse cx="125" cy="40" rx="5" ry="8" fill="#fff" opacity="0.6"/>
<ellipse cx="125" cy="44" rx="3" ry="5" fill="#ff6b6b" opacity="0.8"/>
</g>
<!-- Cake glow -->
<ellipse cx="125" cy="220" rx="80" ry="15" fill="rgba(255,215,0,0.15)" filter="blur(10px)"/>
</svg>
</div>
<button class="next-btn" id="nextBtn">See Your Gift 🎁</button>
<audio id="blowSound"><source src="blowing.mp3" type="audio/mpeg"></audio>
<audio id="bgSong" loop><source src="song.mp3" type="audio/mpeg"></audio>
<script>
const c=document.getElementById('bg'),x=c.getContext('2d');
c.width=innerWidth;c.height=innerHeight;
window.onresize=()=>{c.width=innerWidth;c.height=innerHeight};
let dots=[];
for(let i=0;i<60;i++)dots.push({x:Math.random()*c.width,y:Math.random()*c.height,vx:(Math.random()-0.5)*0.3,vy:(Math.random()-0.5)*0.3,r:Math.random()*1.5+0.5,o:Math.random()*0.4+0.1});
function draw(){x.clearRect(0,0,c.width,c.height);
dots.forEach(d=>{d.x+=d.vx;d.y+=d.vy;
if(d.x<0||d.x>c.width)d.vx*=-1;
if(d.y<0||d.y>c.height)d.vy*=-1;
x.beginPath();x.arc(d.x,d.y,d.r,0,Math.PI*2);
x.fillStyle=`rgba(255,215,0,${d.o})`;x.fill()});
requestAnimationFrame(draw)}draw();

gsap.to('#heading',{opacity:1,duration:1,delay:0.3});
gsap.to('#cakeWrap',{opacity:1,scale:1,duration:1,ease:'elastic.out(1,0.6)',delay:0.6});
setTimeout(()=>{document.getElementById('clickHint').style.opacity=1},1500);

const bgSong=document.getElementById('bgSong');
bgSong.volume=0.5;bgSong.play().catch(()=>{});

let clicked=false;
function blowCandle(){
if(clicked)return;clicked=true;
document.getElementById('clickHint').style.opacity=0;
document.getElementById('blowSound').play().catch(()=>{});
gsap.to('#flame',{scale:3,opacity:0,duration:0.5});
gsap.to('#cakeWrap',{y:-20,duration:0.3,repeat:1,yoyo:true});
createSmoke();
for(let i=0;i<60;i++)createConfetti();
for(let i=0;i<10;i++)createBalloon();
setTimeout(()=>{document.getElementById('nextBtn').classList.add('show')},1500);
}

document.getElementById('cakeWrap').addEventListener('click',blowCandle);

function createSmoke(){
const s=document.createElement('div');s.className='smoke';
const r=document.querySelector('.cake-svg').getBoundingClientRect();
s.style.left=(r.left+r.width/2-4)+'px';s.style.top=(r.top+30)+'px';
document.body.appendChild(s);
gsap.to(s,{y:-60,x:Math.random()*30-15,scale:3,opacity:0,duration:2.5,onComplete:()=>s.remove()});
}

const colors=['#ff6b6b','#ffd700','#ff69b4','#ee5a24','#ff1493','#87ceeb','#dda0dd'];
function createConfetti(){
const p=document.createElement('div');p.className='confetti-piece';
const s=Math.random()*8+4;p.style.width=s+'px';p.style.height=s+'px';
p.style.left=Math.random()*100+'vw';
p.style.background=colors[Math.floor(Math.random()*colors.length)];
if(Math.random()>0.5)p.style.borderRadius='50%';
p.style.animationDuration=(Math.random()*3+2)+'s';
document.body.appendChild(p);setTimeout(()=>p.remove(),5000);
}

function createBalloon(){
const b=document.createElement('div');b.className='balloon';
const s=Math.random()*40+30;b.style.width=s+'px';b.style.height=s*1.2+'px';
b.style.left=Math.random()*100+'vw';
b.style.background=colors[Math.floor(Math.random()*colors.length)];
b.style.animationDuration=(Math.random()*4+5)+'s';
document.body.appendChild(b);setTimeout(()=>b.remove(),9000);
}

document.getElementById('nextBtn').addEventListener('click',()=>{
gsap.to('body',{opacity:0,duration:0.5});
setTimeout(()=>window.location.href='memories.html',600)});
</script>
</body>
</html>
