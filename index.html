<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Phool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
:root{
--soft-pink:#f8c8dc;
--rose-gold:#b76e79;
--rose-gold-light:#e8b4b8;
--golden-glow:#ffd700;
--golden-soft:#f5d060;
--cream:#fdf5e6;
--dark-bg:#050510;
--dark-surface:#0e0e1a;
--text-light:#f0e6f6;
--text-muted:#b8a9c9;
--glass-bg:rgba(255,255,255,0.06);
--glass-border:rgba(255,255,255,0.12);
--font-display:'Playfair Display',serif;
--font-elegant:'Cormorant Garamond',serif;
--font-script:'Great Vibes',cursive;
--font-body:'Poppins',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{height:100vh;overflow:hidden;background:var(--dark-bg);font-family:var(--font-body);color:var(--text-light)}
canvas#bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}

/* Theatre Curtains */
.curtain{position:fixed;top:0;width:50%;height:100vh;z-index:100;overflow:hidden}
.curtain-left{left:0;transform-origin:left center;background:linear-gradient(90deg,#2a0a0a 0%,#4a1020 40%,#3a0815 100%);border-right:3px solid var(--golden-glow)}
.curtain-right{right:0;transform-origin:right center;background:linear-gradient(-90deg,#2a0a0a 0%,#4a1020 40%,#3a0815 100%);border-left:3px solid var(--golden-glow)}
.curtain-fold{position:absolute;top:0;bottom:0;width:33.33%;pointer-events:none}
.curtain-left .curtain-fold:nth-child(1){left:0;background:linear-gradient(90deg,rgba(0,0,0,0.3),transparent)}
.curtain-left .curtain-fold:nth-child(2){left:33.33%;background:linear-gradient(90deg,transparent,rgba(0,0,0,0.15),transparent)}
.curtain-left .curtain-fold:nth-child(3){left:66.66%;background:linear-gradient(90deg,transparent,rgba(0,0,0,0.25))}
.curtain-right .curtain-fold:nth-child(1){right:0;background:linear-gradient(-90deg,rgba(0,0,0,0.3),transparent)}
.curtain-right .curtain-fold:nth-child(2){right:33.33%;background:linear-gradient(-90deg,transparent,rgba(0,0,0,0.15),transparent)}
.curtain-right .curtain-fold:nth-child(3){right:66.66%;background:linear-gradient(-90deg,transparent,rgba(0,0,0,0.25))}

/* Curtain Rod */
#curtain-rod{position:fixed;top:-5px;left:0;right:0;height:12px;z-index:101;background:linear-gradient(180deg,#d4a44c,#b8860b,#d4a44c);border-radius:6px;box-shadow:0 4px 15px rgba(212,164,76,0.4);opacity:0}
#curtain-rod::before,#curtain-rod::after{content:'';position:absolute;top:-8px;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#f0d060,#b8860b);box-shadow:0 2px 8px rgba(0,0,0,0.3)}
#curtain-rod::before{left:-12px}
#curtain-rod::after{right:-12px}

/* Opening content */
.opening-content{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:10;text-align:center;padding:20px}
.fade-element{opacity:0;transform:translateY(30px)}
.star-text{font-size:3rem;margin-bottom:20px}
.elegant-text{font-family:var(--font-elegant);font-size:clamp(1.2rem,3vw,2rem);font-weight:300;letter-spacing:4px;color:var(--text-muted);margin-bottom:10px}
.grand-text{font-family:var(--font-display);font-size:clamp(2.5rem,7vw,5rem);font-weight:900;letter-spacing:10px;background:linear-gradient(135deg,var(--golden-glow),var(--rose-gold-light),var(--golden-glow));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:20px}
.name-text{font-family:var(--font-display);font-size:clamp(3rem,10vw,8rem);font-weight:900;letter-spacing:15px;display:inline-block}
.name-text .letter{display:inline-block;opacity:0}
.letter[data-letter="P"]{background:linear-gradient(180deg,var(--golden-glow) 0%,var(--rose-gold) 50%,var(--soft-pink) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.letter[data-letter="H"]{background:linear-gradient(180deg,var(--rose-gold) 0%,var(--golden-glow) 50%,var(--rose-gold-light) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.letter[data-letter="O"]{background:linear-gradient(180deg,var(--soft-pink) 0%,var(--golden-glow) 50%,var(--rose-gold) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.letter[data-letter="L"]{background:linear-gradient(180deg,var(--golden-glow) 0%,var(--soft-pink) 50%,var(--rose-gold) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

/* Confetti */
.confetti-piece{position:fixed;top:-20px;z-index:150;animation:confettiFall linear forwards}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}

.sound-btn{position:fixed;top:20px;right:20px;width:48px;height:48px;border-radius:50%;background:var(--glass-bg);border:1px solid var(--glass-border);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:300;transition:all 0.3s}
.sound-btn:hover{background:rgba(255,215,0,0.15);transform:scale(1.1)}
.sound-btn svg{width:22px;height:22px;fill:var(--golden-glow)}
.hidden{display:none}

.enter-btn{display:inline-block;padding:16px 50px;background:linear-gradient(135deg,var(--rose-gold),var(--soft-pink));border:none;border-radius:50px;color:#fff;font-family:var(--font-body);font-size:1rem;font-weight:500;cursor:pointer;letter-spacing:1px;transition:all 0.4s cubic-bezier(0.175,0.885,0.32,1.275);box-shadow:0 8px 30px rgba(183,110,121,0.3);opacity:0;transform:translateY(30px)}
.enter-btn:hover{transform:translateY(-3px) scale(1.05);box-shadow:0 12px 40px rgba(183,110,121,0.5)}

@media(max-width:600px){.grand-text{letter-spacing:5px}.name-text{letter-spacing:8px}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="curtain-rod" aria-hidden="true"></div>
<div id="curtain-left" class="curtain curtain-left" aria-hidden="true">
<div class="curtain-fold"></div>
<div class="curtain-fold"></div>
<div class="curtain-fold"></div>
</div>
<div id="curtain-right" class="curtain curtain-right" aria-hidden="true">
<div class="curtain-fold"></div>
<div class="curtain-fold"></div>
<div class="curtain-fold"></div>
</div>

<div class="opening-content">
<div id="sparkle-text-1" class="fade-element star-text">✨</div>
<h2 id="someone-special" class="fade-element elegant-text">Someone Special Has a Birthday Today</h2>
<h1 id="happy-birthday" class="fade-element grand-text">Happy Birthday</h1>
<div id="name-container" class="fade-element">
<h1 id="name-phool" class="name-text">
<span class="letter" data-letter="P">P</span>
<span class="letter" data-letter="H">H</span>
<span class="letter" data-letter="O">O</span>
<span class="letter" data-letter="O">O</span>
<span class="letter" data-letter="L">L</span>
</h1>
</div>
<button class="enter-btn fade-element" id="nextBtn">Celebrate 🎂</button>
</div>

<div class="sound-btn" id="soundBtn">
<svg id="playIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
<svg id="pauseIcon" class="hidden" viewBox="0 0 24 24"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></svg>
</div>

<audio id="bgSong" loop><source src="song.mp3" type="audio/mpeg"></audio>

<script>
const c=document.getElementById('bg'),x=c.getContext('2d');
c.width=innerWidth;c.height=innerHeight;
window.onresize=()=>{c.width=innerWidth;c.height=innerHeight};
let dots=[];
for(let i=0;i<80;i++)dots.push({x:Math.random()*c.width,y:Math.random()*c.height,vx:(Math.random()-0.5)*0.5,vy:(Math.random()-0.5)*0.5,r:Math.random()*2+0.5,o:Math.random()*0.5+0.2});
function draw(){x.clearRect(0,0,c.width,c.height);
dots.forEach(d=>{d.x+=d.vx;d.y+=d.vy;
if(d.x<0||d.x>c.width)d.vx*=-1;
if(d.y<0||d.y>c.height)d.vy*=-1;
x.beginPath();x.arc(d.x,d.y,d.r,0,Math.PI*2);
x.fillStyle=`rgba(255,215,0,${d.o})`;x.fill()});
dots.forEach((a,i)=>{for(let j=i+1;j<dots.length;j++){
let b=dots[j],d=Math.hypot(a.x-b.x,a.y-b.y);
if(d<120){x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);
x.strokeStyle=`rgba(183,110,121,${0.1*(1-d/120)})`;x.stroke()}}});
requestAnimationFrame(draw)}draw();

const bgSong=document.getElementById('bgSong');
bgSong.volume=0.8;
const soundBtn=document.getElementById('soundBtn');
const playIcon=document.getElementById('playIcon');
const pauseIcon=document.getElementById('pauseIcon');
function tryPlay(){bgSong.play().then(()=>{playIcon.classList.add('hidden');pauseIcon.classList.remove('hidden')}).catch(()=>{})}
soundBtn.addEventListener('click',()=>{if(bgSong.paused){tryPlay()}else{bgSong.pause();playIcon.classList.remove('hidden');pauseIcon.classList.add('hidden')}});

const colors=['#ff6b6b','#ffd700','#ff69b4','#ee5a24','#87ceeb','#dda0dd','#b76e79','#f8c8dc'];
function launchConfetti(){for(let i=0;i<60;i++){const p=document.createElement('div');p.className='confetti-piece';
const s=Math.random()*8+4;p.style.width=s+'px';p.style.height=s+'px';
p.style.left=Math.random()*100+'vw';
p.style.background=colors[Math.floor(Math.random()*colors.length)];
if(Math.random()>0.5)p.style.borderRadius='50%';
p.style.animationDuration=(Math.random()*3+2)+'s';
document.body.appendChild(p);setTimeout(()=>p.remove(),5000)}}

let opened=false;
function openCurtain(){
if(opened)return;opened=true;
tryPlay();
const tl=gsap.timeline();
tl.to('#curtain-rod',{opacity:1,duration:0.5,ease:'power2.out'},0)
.to('#curtain-left',{x:'-105%',duration:2.5,ease:'power4.inOut'},0.3)
.to('#curtain-right',{x:'105%',duration:2.5,ease:'power4.inOut'},0.3)
.to('#sparkle-text-1',{opacity:1,y:0,duration:1,ease:'power2.out'},2.5)
.to('#someone-special',{opacity:1,y:0,duration:1,ease:'power2.out'},3.2)
.to('#happy-birthday',{opacity:1,y:0,duration:1.2,ease:'back.out(1.5)'},4.2)
.to('#name-container',{opacity:1,y:0,duration:0.8,ease:'power2.out'},5)
.from('.letter',{y:50,opacity:0,duration:0.6,stagger:0.12,ease:'back.out(2)'},5.5)
.to('#nextBtn',{opacity:1,y:0,duration:0.8,ease:'power2.out'},6.5)
.add(()=>{launchConfetti()},7);
}

document.addEventListener('click',(e)=>{if(e.target.closest('.sound-btn'))return;if(!opened)openCurtain()});

document.getElementById('nextBtn').addEventListener('click',()=>{
gsap.to('.opening-content',{opacity:0,scale:0.9,duration:0.6,ease:'power2.in'});
setTimeout(()=>window.location.href='cake.html',700);
});
</script>
</body>
</html>
