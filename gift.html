<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phool - Tumhare Liye</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;overflow:hidden;background:#0a0a1a;font-family:'Poppins',sans-serif;display:flex;justify-content:center;align-items:center}
canvas#bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}
.gift-card{position:relative;z-index:10;background:rgba(255,255,255,0.05);backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,0.1);border-radius:24px;padding:50px 40px;max-width:500px;width:90%;text-align:center;opacity:0;transform:scale(0.9)}
.gift-icon{font-size:4rem;margin-bottom:15px;animation:giftBounce 2s ease infinite}
@keyframes giftBounce{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-8px) rotate(-5deg)}75%{transform:translateY(-8px) rotate(5deg)}}
h1{font-family:'Great Vibes',cursive;font-size:2.8rem;background:linear-gradient(135deg,#ffd700,#ff6b6b,#ff69b4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.subtitle{color:rgba(255,255,255,0.5);font-size:0.9rem;letter-spacing:3px;text-transform:uppercase;margin-bottom:25px}
.message{color:rgba(255,255,255,0.7);font-size:1rem;line-height:1.8;margin-bottom:25px}
.message strong{color:#ffd700}
.divider{width:50px;height:2px;background:linear-gradient(90deg,transparent,#ffd700,transparent);margin:20px auto}
.address-box{background:rgba(255,215,0,0.06);border:1px solid rgba(255,215,0,0.2);border-radius:16px;padding:25px;margin:20px 0}
.address-box h3{font-family:'Great Vibes',cursive;color:#ffd700;font-size:1.4rem;margin-bottom:5px}
.address-box .hint{color:rgba(255,255,255,0.45);font-size:0.8rem;margin-bottom:15px}
.input-field{width:100%;max-width:320px;padding:12px 18px;border:1px solid rgba(255,255,255,0.12);border-radius:12px;background:rgba(255,255,255,0.05);color:#fff;font-family:'Poppins',sans-serif;font-size:0.95rem;outline:none;transition:border 0.3s;margin-bottom:10px;display:block;margin-left:auto;margin-right:auto}
.input-field::placeholder{color:rgba(255,255,255,0.3)}
.input-field:focus{border-color:rgba(255,215,0,0.5)}
.textarea-field{min-height:70px;resize:vertical}
.send-btn{display:inline-block;padding:14px 40px;background:linear-gradient(135deg,#ffd700,#ff6b6b);border:none;border-radius:50px;color:#0a0a1a;font-family:'Poppins',sans-serif;font-size:1rem;font-weight:600;cursor:pointer;transition:all 0.4s;box-shadow:0 8px 25px rgba(255,107,107,0.3);margin-top:10px}
.send-btn:hover{transform:translateY(-3px) scale(1.05);box-shadow:0 12px 35px rgba(255,107,107,0.5)}
.phone-box{margin-top:20px;padding:15px;border:1px solid rgba(255,255,255,0.08);border-radius:12px}
.phone-box p{color:rgba(255,255,255,0.4);font-size:0.8rem;margin-bottom:5px}
.phone-box span{color:#ffd700;font-size:1.4rem;font-weight:600;letter-spacing:2px}
.confetti-piece{position:fixed;top:-20px;z-index:15;animation:confettiFall linear forwards}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
@media(max-width:600px){.gift-card{padding:35px 20px}h1{font-size:2.2rem}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="gift-card" id="giftCard">
<div class="gift-icon">🎁</div>
<h1>Tumhare Liye Phool!</h1>
<div class="subtitle">— Special Surprise —</div>
<div class="divider"></div>
<p class="message">Tumhare liye ek chhota sa tohfa hai. <br>Apna <strong>naam</strong> aur <strong>address</strong> bhejo!</p>

<div class="address-box">
<h3>Address Bhejo 📍</h3>
<p class="hint">Tumhara tohfa seedha tumhare paas aayega!</p>
<input type="text" id="nameInput" placeholder="Tumhara Naam" class="input-field">
<textarea id="addrInput" placeholder="Tumhara Address..." class="input-field textarea-field"></textarea>
<button class="send-btn" id="sendBtn">WhatsApp Par Bhejo 📲</button>
</div>

<div class="phone-box">
<p>Mujhse seedha baat karo</p>
<span>9919917791</span>
</div>
</div>
<audio id="bgSong" loop><source src="song.mp3" type="audio/mpeg"></audio>
<script>
const c=document.getElementById('bg'),x=c.getContext('2d');
c.width=innerWidth;c.height=innerHeight;
window.onresize=()=>{c.width=innerWidth;c.height=innerHeight};
let dots=[];
for(let i=0;i<60;i++)dots.push({x:Math.random()*c.width,y:Math.random()*c.height,vx:(Math.random()-0.5)*0.4,vy:(Math.random()-0.5)*0.4,r:Math.random()*2+0.5,o:Math.random()*0.4+0.1});
function draw(){x.clearRect(0,0,c.width,c.height);
dots.forEach(d=>{d.x+=d.vx;d.y+=d.vy;
if(d.x<0||d.x>c.width)d.vx*=-1;
if(d.y<0||d.y>c.height)d.vy*=-1;
x.beginPath();x.arc(d.x,d.y,d.r,0,Math.PI*2);
x.fillStyle=`rgba(255,215,0,${d.o})`;x.fill()});
dots.forEach((a,i)=>{for(let j=i+1;j<dots.length;j++){
let b=dots[j],d=Math.hypot(a.x-b.x,a.y-b.y);
if(d<100){x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);
x.strokeStyle=`rgba(255,107,107,${0.08*(1-d/100)})`;x.stroke()}}});
requestAnimationFrame(draw)}draw();

gsap.to('#giftCard',{opacity:1,scale:1,duration:1,ease:'elastic.out(1,0.6)',delay:0.3});

const bgSong=document.getElementById('bgSong');
bgSong.volume=0.5;bgSong.play().catch(()=>{});

const colors=['#ff6b6b','#ffd700','#ff69b4','#ee5a24','#87ceeb','#dda0dd'];
document.getElementById('sendBtn').addEventListener('click',function(){
const name=document.getElementById('nameInput').value.trim();
const addr=document.getElementById('addrInput').value.trim();
if(!name||!addr){alert('Naam aur Address dono likho! 😊');return}
const msg='Hi! Main Phool hoon 🎂\n\nNaam: '+name+'\nAddress: '+addr+'\n\nBirthday thanks! 💛';
window.open('https://wa.me/9919917791?text='+encodeURIComponent(msg),'_blank');
for(let i=0;i<50;i++){const p=document.createElement('div');p.className='confetti-piece';
const s=Math.random()*8+4;p.style.width=s+'px';p.style.height=s+'px';
p.style.left=Math.random()*100+'vw';
p.style.background=colors[Math.floor(Math.random()*colors.length)];
if(Math.random()>0.5)p.style.borderRadius='50%';
p.style.animationDuration=(Math.random()*3+2)+'s';
document.body.appendChild(p);setTimeout(()=>p.remove(),5000)}
});
</script>
</body>
</html>
